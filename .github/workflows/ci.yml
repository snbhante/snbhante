name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm README exists
        run: |
          test -f README.md
          echo "CI check passed"
