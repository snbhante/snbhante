name: Update YouTube Stats
on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update README with YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UC3WIwB7nbYMEvWW4CGQGYsA
        run: |
          python .github/scripts/update_youtube_stats.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "No YouTube stats changes to commit."
            exit 0
          fi

          git add README.md
          git commit -m "Auto-update YouTube stats"
          git push
