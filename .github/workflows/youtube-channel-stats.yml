name: Update YouTube Stats
on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch YouTube data
        uses: DenverCoder1/github-readme-youtube-stats@main
        with:
          channel_id: UC3WIwB7nbYMEvWW4CGQGYsA   # replace with your channel ID
          output_file: README.md
          template_file: README.md
          max_videos: 6
          include_playlists: true
          include_posts: true
          include_statistics: true   # adds subs, views, video count

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "No YouTube stats changes to commit."
            exit 0
          fi

          git add README.md
          git commit -m "Auto-update YouTube stats"
          git push
